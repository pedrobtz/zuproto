on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  schedule:
    - cron: "16 15 * * 0"
  workflow_dispatch:
  pull_request:

name: vendor

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# src/vendor/ must be protobuf's files at the commit in src/vendor/PROVENANCE
# plus exactly tools/patches/. A change under src/vendor/ must update
# PROVENANCE too.
jobs:
  # Skips documentation and metadata-only changes, CRAN-SUBMISSION
  # included, by the same rules as the r-actions workflows.
  changes:
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: vendor

  vendor:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    uses: pedrobtz/r-actions/.github/workflows/vendor.yml@v1
    with:
      vendor-dir: src/vendor
      verify: tools/verify-vendor
      must-update: |
        src/vendor/PROVENANCE
