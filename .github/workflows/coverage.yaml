on:
  push:
    branches: [main, master]
  pull_request:

name: coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    # Pinned to a commit because this workflow holds a write token.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@8caf5119301bb2a3bd433b92045b8c75b3097096 # v1.24.0
    permissions:
      contents: write
    with:
      # The main ruleset takes no direct pushes, so the badge goes to gh-pages.
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
