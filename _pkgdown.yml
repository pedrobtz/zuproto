url: https://pedrobtz.github.io/zuproto/
template:
  bootstrap: 5


reference:
- title: Pools
  desc: Load descriptor sets and see the types they hold.
  contents:
  - proto_pool
  - proto_types
- title: One message
  desc: Decode and encode a single message.
  contents:
  - proto_decode
  - proto_encode
