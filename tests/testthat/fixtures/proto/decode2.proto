// proto2: closed enums, explicit defaults, required, extensions.
syntax = "proto2";

package zpb.decode2;

enum Closed {
  ZERO = 0;
  ONE = 1;
  TWO = 2;
}

message Legacy {
  required int32 id = 1;
  optional string name = 2 [default = "anon"];
  optional int32 count = 3 [default = 7];
  optional Closed closed = 4 [default = TWO];
  repeated int32 values = 5;
  extensions 100 to 199;
}

extend Legacy {
  optional string tag = 100;
  repeated int32 codes = 101;
}

// proto2 groups, singular and repeated, for decoding, encoding and writing
// back a data frame with a group column (#118).
message Grouped {
  optional group Item = 1 {
    optional int32 a = 2;
  }
  repeated group Row = 3 {
    optional string s = 4;
  }
}

// A field named like the oneof's case column, which build_frame() then
// names kind_case_ (#115).
message CaseClash {
  oneof kind {
    int32 a = 1;
    string b = 2;
  }
  optional int32 kind_case = 3;
}
