// Every row of design section 6, proto3. tools/make-fixtures.py writes
// messages of these types; test-decode.R checks how each decodes.
syntax = "proto3";

package zpb.decode;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

enum Level {
  LEVEL_UNSPECIFIED = 0;
  LOW = 1;
  HIGH = 2;
}

message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  sint32 f_sint32 = 4;
  sfixed32 f_sfixed32 = 5;
  uint32 f_uint32 = 6;
  fixed32 f_fixed32 = 7;
  int64 f_int64 = 8;
  uint64 f_uint64 = 9;
  sint64 f_sint64 = 10;
  fixed64 f_fixed64 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
  Level f_enum = 16;
  optional int32 f_optional = 17;
}

message Repeated {
  repeated int32 packed = 1;
  repeated int32 unpacked = 2 [packed = false];
  repeated string strings = 3;
  repeated bytes blobs = 4;
  repeated Level levels = 5;
  repeated Point points = 6;
  repeated double doubles = 7;
  repeated bool flags = 8;
}

message Point {
  int32 x = 1;
  int32 y = 2;
  Point next = 3;
}

message Maps {
  map<string, int32> by_string = 1;
  map<int32, string> by_int32 = 2;
  map<int64, string> by_int64 = 3;
  map<bool, string> by_bool = 4;
  map<uint32, Point> points = 5;
  map<string, Level> levels = 6;
}

message Choice {
  oneof kind {
    string text = 1;
    int64 number = 2;
    Point point = 3;
  }
  string other = 4;
}

message WellKnown {
  google.protobuf.Timestamp when = 1;
  google.protobuf.Duration took = 2;
  google.protobuf.Int32Value i32 = 3;
  google.protobuf.Int64Value i64 = 4;
  google.protobuf.UInt32Value u32 = 5;
  google.protobuf.UInt64Value u64 = 6;
  google.protobuf.FloatValue f32 = 7;
  google.protobuf.DoubleValue f64 = 8;
  google.protobuf.BoolValue flag = 9;
  google.protobuf.StringValue text = 10;
  google.protobuf.BytesValue blob = 11;
  google.protobuf.Struct meta = 12;
  google.protobuf.Value value = 13;
  google.protobuf.ListValue list = 14;
  google.protobuf.Any any = 15;
  google.protobuf.FieldMask mask = 16;
  google.protobuf.Empty empty = 17;
  repeated google.protobuf.Timestamp times = 18;
  google.protobuf.Int32Value unset_wrapper = 19;
}

message Nested {
  int32 depth = 1;
  Nested child = 2;
}

// map<uint64, ...> keys, sorted and written unsigned (#34).
message Uint64Keys {
  map<uint64, string> by_uint64 = 1;
}

// A oneof inside a message field and a repeated one, for the nested
// <oneof>_case columns of a data frame (#28).
message Outer {
  Choice inner = 1;
  repeated Choice items = 2;
}
